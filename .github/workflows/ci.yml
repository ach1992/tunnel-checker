name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install network smoke dependency
        run: sudo apt-get update && sudo apt-get install -y socat

      - name: Bash syntax and smoke tests
        run: bash tests/smoke.sh && bash tests/network-smoke.sh
